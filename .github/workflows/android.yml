name: Build Android APK
on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: |
          if [ -f "proj.android-studio/gradlew" ]; then chmod +x proj.android-studio/gradlew; fi
          if [ -f "proj.android/gradlew" ]; then chmod +x proj.android/gradlew; fi

      - name: Build with Gradle
        run: |
          if [ -d "proj.android-studio" ]; then
            cd proj.android-studio
            ./gradlew assembleDebug
          elif [ -d "proj.android" ]; then
            cd proj.android
            ./gradlew assembleDebug
          else
            echo "Không tìm thấy thư mục Android project!"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: XPlan-APK
          path: "**/*.apk"
