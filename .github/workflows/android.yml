name: Build Android APK
on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: 'recursive'

      - name: set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build APK
        run: |
          # Lưu ý: Các lệnh này phụ thuộc vào cấu trúc của Cocos2d-x
          # Thông thường sẽ chạy script build của dự án
          cd proj.android
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: my-game-apk
          path: proj.android/app/build/outputs/apk/debug/*.apk
