name: Build Android APK
on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Build APK (Auto Find Path)
        run: |
          # Tìm file gradlew ở bất cứ đâu trong repo
          GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "Không tìm thấy file gradlew nào trong toàn bộ dự án!"
            exit 1
          fi
          
          # Lấy thư mục chứa file đó
          BUILD_DIR=$(dirname "$GRADLEW_PATH")
          echo "Đã tìm thấy dự án tại: $BUILD_DIR"
          
          # Cấp quyền và chạy build
          chmod +x "$GRADLEW_PATH"
          cd "$BUILD_DIR"
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: XPlan-APK
          path: "**/*.apk"
