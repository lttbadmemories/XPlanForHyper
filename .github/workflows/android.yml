- name: Fix Gradle & Build
  run: |
    GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
    BUILD_DIR=$(dirname "$GRADLEW_PATH")
    cd "$BUILD_DIR"

    chmod +x ./gradlew

    # Xóa repo Aliyun
    find . -name "*.gradle" -exec sed -i '/aliyun/d' {} +

    # Thêm google + mavenCentral
    for file in $(find . -name "*.gradle"); do
      sed -i '/repositories {/a\    google()\n    mavenCentral()' "$file"
    done

    # Fix MaxPermSize
    grep -rl "MaxPermSize" . | xargs sed -i 's/-XX:MaxPermSize=[^ "]*//g' || true

    # Build (retry 3 lần)
    for i in 1 2 3; do
      ./gradlew assembleDebug --no-daemon \
        --refresh-dependencies \
        -Dorg.gradle.jvmargs="-Xmx2048m -XX:MaxMetaspaceSize=512m" \
        -Pandroid.useAndroidX=true \
        -Pandroid.enableJetifier=true && break
    done
