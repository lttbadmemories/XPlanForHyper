name: Build Android APK
on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Fix Gradle & Build
        run: |
          GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
          BUILD_DIR=$(dirname "$GRADLEW_PATH")
          cd "$BUILD_DIR"

          chmod +x ./gradlew

          # 1. XÓA repo Aliyun (rất quan trọng)
          find . -name "*.gradle" -exec sed -i '/aliyun/d' {} +

          # 2. ĐẢM BẢO có google + mavenCentral
          find . -name "*.gradle" -exec sed -i 's/repositories {/repositories {\n    google()\n    mavenCentral()/g' {} +

          # 3. Fix MaxPermSize
          grep -rl "MaxPermSize" . | xargs sed -i 's/-XX:MaxPermSize=[^ "]*//g' || true

          # 4. Build + refresh dependencies + retry
          for i in 1 2 3; do
            ./
