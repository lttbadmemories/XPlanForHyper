name: Build Android APK
on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Hard Fix & Build
        run: |
          GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
          BUILD_DIR=$(dirname "$GRADLEW_PATH")
          cd "$BUILD_DIR"

          # 1. Sửa lỗi máy chủ Maven Trung Quốc
          find . -name "*.gradle" -exec sed -i 's/maven.aliyun.com/repo1.maven.org/g' {} +

          # 2. Xóa triệt để cấu hình MaxPermSize trong mọi file
          grep -rl "MaxPermSize" . | xargs sed -i 's/-XX:MaxPermSize=[^ "]*//g' || true

          # 3. Chạy build và ÉP hệ thống dùng cấu hình bộ nhớ mới của Java 17
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx2048m -XX:MaxMetaspaceSize=512m" \
            -Pandroid.useAndroidX=true \
            -Pandroid.enableJetifier=true
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: XPlan-APK
          path: "**/*.apk"
