name: Build Android APK
on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Fix Repositories & Build
        run: |
          # Tìm file build.gradle hoặc settings.gradle
          GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
          BUILD_DIR=$(dirname "$GRADLEW_PATH")
          cd "$BUILD_DIR"

          # Lệnh này sẽ thay thế các kho lưu trữ lỗi bằng kho chuẩn
          find . -name "*.gradle" -exec sed -i 's/maven.aliyun.com/repo1.maven.org/g' {} +
          
          # Cấp quyền và build lại
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: XPlan-APK
          path: "**/*.apk"
