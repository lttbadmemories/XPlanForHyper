name: Build Android APK
on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build APK (Clean Config)
        run: |
          GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "Không tìm thấy file gradlew nào!"
            exit 1
          fi
          
          BUILD_DIR=$(dirname "$GRADLEW_PATH")
          chmod +x "$GRADLEW_PATH"
          cd "$BUILD_DIR"

          # Xóa bỏ các thông số Java cũ (như MaxPermSize) trong file gradle.properties nếu có
          if [ -f "gradle.properties" ]; then
            sed -i 's/-XX:MaxPermSize=[^ ]*//g' gradle.properties
            sed -i 's/-XX:+MaxPermSize=[^ ]*//g' gradle.properties
          fi

          # Chạy build và bỏ qua các tùy chọn Java lỗi thời từ môi trường
          export GRADLE_OPTS="-Xmx2048m -Dorg.gradle.jvmargs='-Xmx2048m'"
          ./gradlew assembleDebug --no-daemon
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: XPlan-APK
          path: "**/*.apk"
